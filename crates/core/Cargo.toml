[package]
name = "wove"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust library to build terminal user interfaces"
readme = "README.md"
documentation = "https://docs.rs/wove"
keywords = ["terminal", "tui", "elements", "layout"]
categories = ["command-line-interface"]

[features]
default = ["terminal"]
terminal = ["dep:crossterm"]

[dependencies]
unicode-segmentation = "1.13"
unicode-width = "0.2"
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
crossterm = { version = "0.29", optional = true }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
required-features = ["terminal"]

[[example]]
name = "measure"
path = "examples/measure.rs"
