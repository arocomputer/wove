[workspace]
members = ["crates/core", "crates/dioxus", "crates/ssh", "crates/keymap", "crates/gpu", "crates/examples"]
exclude = ["crates/web"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/arocomputer/wove"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
