name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Build scripts and tests run without write access or persisted credentials.
  # Archives are packaged, hashed, and uploaded before any other tooling runs
  # in this workspace, so later steps cannot change the released bytes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit and internal versions
        run: python3 scripts/release.py --verify
      - name: Verify tag and prepare archives
        run: python3 scripts/release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: artifacts/release
          if-no-files-found: error
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Software Vulkan for GPU tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: ./x check
      - run: ./x ui
      - run: ./x web
      - run: ./x guides
      - run: ./x audit
  # Only this job can write, and it runs no repository code.
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify downloaded archives
        run: cd release && sha256sum --check SHA256SUMS
      - name: Attest verified crate archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.crate
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
