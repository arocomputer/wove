name: Publish registry packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Authorized version tag, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: registry-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/release.py --verify --tag "$RELEASE_TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
          no-cache: true
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: ./x check
      - run: ./x ui
      - run: ./x web
      - run: ./x guides
      - run: ./x audit
      - run: python3 scripts/release.py --tag "$RELEASE_TAG"
      - run: python3 scripts/registry.py artifacts/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry
          path: artifacts/release
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry
          path: release
      # Upload bodies were prepared without credentials. No checkout or crate execution.
      - name: Verify archives and upload bodies
        run: |
          cd release
          sha256sum --check SHA256SUMS
      - name: Select unpublished packages and reject conflicting registry versions
        id: pending
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          pending = []
          for name in ('wove', 'wove-dioxus', 'wove-keymap', 'wove-ssh', 'wove-gpu'):
              try:
                  with urlopen(f'https://index.crates.io/{name[:2]}/{name[2:4]}/{name}', timeout=30) as response:
                      entries = [json.loads(line) for line in response.read().decode().splitlines()]
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  entries = []
              existing = next((entry for entry in entries if entry['vers'] == version), None)
              if existing is None:
                  pending.append(name)
              else:
                  checksum = hashlib.sha256(Path(f'release/{name}-{version}.crate').read_bytes()).hexdigest()
                  if existing['yanked'] or existing['cksum'] != checksum:
                      raise ValueError(f'{name} {version} already exists with a different archive or is yanked')
                  print(f'{name} {version}: identical version already published')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('packages=' + ' '.join(pending) + '\n')
          PY
      - id: auth
        if: steps.pending.outputs.packages != ''
        uses: rust-lang/crates-io-auth-action@9c067fc5d5c254b33978fed918cb50c032549d0e
      - name: Publish core before dependent crates
        if: steps.pending.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGES: ${{ steps.pending.outputs.packages }}
        run: |
          version=${RELEASE_TAG#v}
          for package in $PACKAGES; do
            curl --fail-with-body --silent --show-error --max-time 60 --request PUT \
              --header "Authorization: $CARGO_REGISTRY_TOKEN" \
              --header 'Content-Type: application/octet-stream' --header 'Accept: application/json' \
              --data-binary "@release/$package-$version.publish" \
              https://crates.io/api/v1/crates/new --output response.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path('response.json').read_text())
          if response.get('errors'):
              raise ValueError(response['errors'])
          print(response.get('warnings', {}))
          PY
            # Wait for index visibility before a dependent package is uploaded.
            PACKAGE="$package" VERSION="$version" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          from urllib.error import HTTPError
          from urllib.request import urlopen
          name, version = os.environ['PACKAGE'], os.environ['VERSION']
          checksum = hashlib.sha256(Path(f'release/{name}-{version}.crate').read_bytes()).hexdigest()
          for attempt in range(60):
              try:
                  with urlopen(f'https://index.crates.io/{name[:2]}/{name[2:4]}/{name}', timeout=15) as response:
                      entries = [json.loads(line) for line in response.read().decode().splitlines()]
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  entries = []
              published = next((entry for entry in entries if entry['vers'] == version), None)
              if published is not None:
                  if published['cksum'] != checksum or published['yanked']:
                      raise ValueError('registry archive does not match the verified release')
                  break
              time.sleep(2)
          else:
              raise TimeoutError(f'{name} {version} did not appear in the index')
          PY
          done
