name: Website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  website:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.affected.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: affected
        run: ./x affected website
      - name: Validate change selection
        run: test '${{ steps.affected.outputs.run }}' = true || test '${{ steps.affected.outputs.run }}' = false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.affected.outputs.run == 'true'
        with:
          bun-version: '1.4.2'
      - run: ./x web
        if: steps.affected.outputs.run == 'true'
      # Pull requests only check the site; main publishes the output it just built.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.affected.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: crates/web/dist
  deploy:
    needs: website
    if: needs.website.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
