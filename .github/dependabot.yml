version: 2
updates:
  - package-ecosystem: cargo
    labels: []
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    labels: []
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    labels: []
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    labels: []
    directory: /crates/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Astro toolchain rejects TS7 (assertCompatibleTypeScript); stay on v5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    labels: []
    directory: /scripts/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
